.m2 { --m2-ink: #0e0e10; --m2-line: #e6e6ea; background: #fff; color: var(--m2-ink); }
.m2-top {

}
/* 제목 끝의 가느다란 가로획 — 시즌 이름이 「계속된다」는 표시 */
.m2-top h1::after { content: ''; display: inline-block; width: 0.9em; height: 0.07em; margin-left: 0.12em; vertical-align: 0.22em; background: var(--m2-ink); }
.m2-note { margin: 0; max-width: 22em; font-size: 0.95rem; line-height: 1.7; color: #55555c; text-align: right; }

.m2-rail {
  display: flex; gap: clamp(0.8rem, 1.6vw, 1.4rem); overflow-x: auto; scroll-snap-type: x mandatory;
  padding: clamp(2rem, 5vh, 3rem) clamp(1.5rem, 4vw, 3rem) 1.5rem; scroll-padding-inline: clamp(1.5rem, 4vw, 3rem);
  scrollbar-width: thin; scrollbar-color: var(--m2-ink) transparent;
}
.m2-look { flex: 0 0 clamp(240px, 24vw, 340px); scroll-snap-align: start; text-decoration: none; color: inherit; }
.m2-stage {
  position: relative; display: grid; place-items: center; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 4px;
  background: radial-gradient(120% 90% at 50% 18%, #fff 0%, var(--c) 58%, color-mix(in srgb, var(--c) 70%, #000) 100%);
}
/* 바닥 그림자 — 오브젝트가 무대에 **서 있다** */
.m2-stage::after { content: ''; position: absolute; bottom: 17%; width: 46%; height: 5%; border-radius: 50%; background: rgba(0, 0, 0, 0.22); filter: blur(8px); }
.m2-stage img { position: relative; z-index: 1; width: 64%; height: auto; margin-bottom: 12%; transition: translate 0.5s var(--ease); }
.m2-look:hover .m2-stage img, .m2-look:focus-visible .m2-stage img { translate: 0 -10px; }
.m2-look:focus-visible { outline: 2px solid var(--m2-ink); outline-offset: 4px; }
.m2-no { position: absolute; top: 0.9rem; left: 1rem; z-index: 1; font-family: var(--sans); font-size: 0.82rem; }
.m2-cap { display: flex; justify-content: space-between; gap: 1rem; padding: 0.8rem 0 0; border-top: 1px solid var(--m2-ink); margin-top: 0.9rem; font-size: 0.92rem; }
.m2-cap span { color: #6b6b73; }

.m2-foot { max-width: 1440px; margin: 0 auto; padding: 1.5rem clamp(1.5rem, 4vw, 3rem) clamp(3.5rem, 9vh, 6rem);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; font-size: 0.95rem; border-top: 1px solid var(--m2-line); }
.m2-foot a { text-decoration: none; border-bottom: 1px solid currentColor; }
.m2-foot a:hover { opacity: 0.6; }

@media (max-width: 760px) {
  .m2-top { grid-template-columns: 1fr; }
  .m2-note { text-align: left; }
  .m2-look { flex-basis: 72vw; }
}
@media (prefers-reduced-motion: reduce) { .m2-stage img { transition: none; } }
</style>
