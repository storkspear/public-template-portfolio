# ─────────────────────────────────────────────────────────────
#  이 파일 하나로 공개 화면과 관리자 화면을 가릅니다.
#
#  혼자 섭니다 — 바깥 설정 파일에 기대지 않습니다. 필요한 zone·map 을 여기서
#  선언하므로 남의 nginx 에 그대로 올려도 뜹니다.
#
#  도메인을 붙일 때는 `server_name` 두 줄과 `listen` 만 고치면 됩니다.
#  TLS 는 각자 붙이세요(certbot·Cloudflare·그 밖에).
# ─────────────────────────────────────────────────────────────

# 관리자 로그인에 초당 몇 번씩 두드리는 것을 막습니다.
# 10MB 면 주소 16만 개쯤 기억합니다 — 개인 사이트에는 넘칩니다.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ── 공개 화면 ────────────────────────────────────────────────
server {
  listen 8080;
  server_name _;                    # 도메인을 붙이면 여기에 적으세요

  root /srv/public;
  index index.html;
  charset utf-8;

  # 리다이렉트에 호스트와 포트를 박지 않습니다. 켜 두면 `Location:` 이
  # `http://$host:8080/…` 이 되어, 포트를 옮겨 띄운 사람이나 TLS 프록시 뒤의
  # 배포자가 슬래시 없는 주소에서 엉뚱한 자리로 튕깁니다.
  absolute_redirect off;
  server_tokens off;

  # 발행된 글은 JS 가 0바이트입니다. 그래서 캐시를 길게 잡아도 안전합니다.
  # 다만 HTML 은 짧게 — 글을 고치면 바로 보여야 합니다.
  # ── 첫 화면과 포트폴리오 ──
  #
  # 굽기가 `/data/www` 에 두 화면을 만들고, 아래 `try_files` 가 그것을 집습니다.
  # 본문이 관리자에서 온 것이든(템플릿) 레포의 `pages/*.html` 이든(직접 디자인)
  # 나오는 것은 구운 파일 하나입니다 — nginx 는 그 차이를 모릅니다.
  #
  # `@repo` 는 굽기가 아직 한 번도 안 돈 상태의 안전망입니다(첫 부팅·DB 지연).
  # 평소에는 안 탑니다.
  location = / {
    root /srv/data/www;
    try_files /index.html @repo;
    add_header Cache-Control "public, max-age=60";
    include /etc/nginx/conf.d/secure.inc;
  }
  location = /index.html {
    root /srv/data/www;
    try_files /index.html @repo;
    add_header Cache-Control "public, max-age=60";
    include /etc/nginx/conf.d/secure.inc;
  }
  # 작업 상세는 폴더로 끝나야 상대 주소가 맞습니다 — 슬래시를 붙여 돌려보냅니다
  location ~ ^/portfolio/([^/.]+)$ { return 301 /portfolio/$1/; }
  location ^~ /portfolio/ {
    alias /srv/data/www/portfolio/;
    try_files $uri $uri/index.html @repo;
    add_header Cache-Control "public, max-age=60";
    include /etc/nginx/conf.d/secure.inc;
  }
  location @repo {
    root /srv/public;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "public, max-age=60";
    include /etc/nginx/conf.d/secure.inc;
  }

  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "public, max-age=60";
    include /etc/nginx/conf.d/secure.inc;
  }

  # 구운 글과 올린 사진. api 가 쓰는 볼륨을 읽기 전용으로 같이 봅니다.
  #
  # `$uri/` 를 넣으면 안 됩니다. 글을 내리면 굽기가 `index.html` 만 지우고 폴더는
  #   남기는데(사진 원본이 거기 있습니다), `$uri/` 가 그 빈 폴더의 목록을 내려다
  #   autoindex 가 꺼져 있어 403 이 됩니다. 「없는 글」은 404 여야 합니다 —
  #   403 은 「여기 뭔가 있는데 못 보여준다」는 뜻이라 내린 글의 존재를 알려 줍니다.
  location ^~ /blog/ {
    alias /srv/data/blog/;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "public, max-age=60";
    include /etc/nginx/conf.d/secure.inc;

    # 올린 탭 아이콘(`/blog/0/{id}.svg`). SVG 는 그림이 아니라 문서라 주소로 직접 열면
    #   스크립트가 돕니다. 서버가 저장 전에 거르지만(`svgUnsafe`) 한 겹 더 잠급니다 —
    #   거르는 쪽이 빠뜨려도 여기서 안 돌아야 합니다.
    # `<img>` 로 그리는 것은 CSP 와 무관하므로 관리자 미리보기는 그대로 보입니다.
    #   `style-src` 를 여는 이유는 다크 탭에서 색을 뒤집는 `<style>` 이 그 안에 있어서입니다.
    # add_header 를 쓰면 위 것이 이 location 에서 사라집니다 — 다시 적습니다.
    location ~* ^/blog/.+\.svg$ {
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/conf.d/secure.inc;
    }
  }

  # CSS·글꼴은 파일 이름에 ?v= 가 붙거나 내용이 안 바뀝니다. 길게 잡습니다.
  #
  # 정규식 location 은 접두 location 보다 먼저 고릅니다. 그래서 `/blog/`·`/portfolio/`
  #   에는 `^~` 를 붙여 둡니다 — 안 붙이면 올린 사진(`/blog/{번호}/{id}.png`)이 이 블록에
  #   걸리고, 여기엔 `alias` 가 없어 `root /srv/public` 에서 찾다 404 가 납니다
  #   (관리자 포트에는 이 정규식이 없어서 「관리자에선 보이는데 공개면만 깨짐」이 됩니다).
  location ~* \.(css|js|woff2?|svg|png|jpe?g|gif|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/conf.d/secure.inc;
  }

  # 관리자 API 는 이 포트로 열지 않습니다. 공개 화면에서는 닿을 수 없어야 합니다.
  location /api/ { return 404; }

  # nginx 의 `add_header` 는 상속되지 않습니다 — location 안에 `add_header` 가
  #   하나라도 있으면 이 server 블록의 것이 통째로 무시됩니다. 그래서 캐시 헤더를 쓰는
  #   location 마다 `secure.inc` 를 include 합니다. 여기 것은 아무 헤더도 안 쓰는
  #   location(있다면)을 위한 바닥값입니다.
  include /etc/nginx/conf.d/secure.inc;
}

# ── 관리자 화면 ──────────────────────────────────────────────
server {
  listen 8081;
  server_name _;                    # 관리자 도메인을 따로 둘 거면 여기에

  root /srv/admin;                  # 관리자 SPA — docker/web.Dockerfile 이 이미지에 굽습니다
  index index.html;
  absolute_redirect off;
  server_tokens off;
  charset utf-8;

  # 사진 올리기가 있어서 넉넉히. 이걸 안 올리면 큰 사진에서 413 이 납니다.
  client_max_body_size 25m;

  # SPA — 어느 주소로 들어와도 index.html 을 줍니다.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/admin-secure.inc;
  }

  location /api/ {
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 굽기는 글이 많아지면 몇 초 걸립니다. 기본 60초로 두면 발행이 끊깁니다.
    proxy_read_timeout 120s;
  }

  # 로그인만 따로 조입니다. burst 를 두지 않으면 사람이 오타 한 번에 막힙니다.
  location = /api/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 관리자가 글을 미리 볼 수 있어야 합니다 — 공개 화면과 같은 파일을 봅니다.
  # 공개 쪽과 같은 이유로 `$uri/` 를 빼 둡니다(위 주석 참고).
  location ^~ /blog/   {
    alias /srv/data/blog/; try_files $uri $uri/index.html =404;
    # 관리자 오리진에서도 올린 SVG 가 스크립트를 못 돌리게 합니다 — 여기가 원래 위험한 자리입니다
    #   (같은 오리진에 로그인 토큰이 있습니다). `<img>` 미리보기는 영향을 안 받습니다.
    # include 는 **이 블록이 쓰는 것**이어야 합니다 — `secure.inc` 를 넣으면 X-Frame-Options 가
    #   DENY 에서 SAMEORIGIN 으로 내려앉고 X-Robots-Tag 가 통째로 빠집니다(응답 헤더로 확인).
    location ~* ^/blog/.+\.svg$ {
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
      include /etc/nginx/conf.d/admin-secure.inc;
    }
  }
  location /fonts/  { alias /srv/public/fonts/; }
  # 「설정」의 파비콘 고르기가 「기본」 칸에 레포 파일을 그대로 보여 줍니다
  location = /favicon.svg { root /srv/public; }

  # 「모양」 화면의 미리보기 — 관리자 포트에만 둡니다.
  # 저장 전의 모양이라 공개면에 나가면 안 됩니다(공개 서버 블록에는 이 자리가 없습니다).
  location ^~ /preview/ {
    alias /srv/data/preview/;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/preview-secure.inc;
  }
  # 관리자에서도 구운 첫 화면·작업을 눌러 볼 수 있어야 합니다.
  # 공개면과 같은 폴백을 둡니다 — 한쪽만 =404 면 같은 주소가 포트마다 다르게 답합니다.
  location ^~ /portfolio/ {
    alias /srv/data/www/portfolio/;
    try_files $uri $uri/index.html @admin_repo;
  }
  location @admin_repo {
    root /srv/public;
    try_files $uri $uri/index.html =404;
  }

  # `/assets/` 는 두 곳을 봐야 합니다.
  #    · 관리자 제 번들   /srv/admin/assets/index-*.js|css   (vite build 결과)
  #    · 본문 미리보기용  /srv/public/assets/prose.css 등    (공개 화면과 같은 파일)
  #   공개 쪽만 alias 했더니 관리자 번들이 404 가 나 화면이 통째로 비었습니다
  #   (root 는 있는데 자식이 0개였습니다). 제 것을 먼저 보고, 없으면 공개 쪽으로.
  location /assets/ {
    root /srv/admin;
    try_files $uri @public_assets;
  }
  location @public_assets {
    root /srv/public;
  }

  # 같은 이유로(상속 없음) 관리자 쪽도 location 마다 `admin-secure.inc` 를 넣습니다.
  include /etc/nginx/conf.d/admin-secure.inc;
}
