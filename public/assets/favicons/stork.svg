<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="황새">
  <style>
    /* 어두운 탭에서 검정은 사라진다. 눈에 보이는 쪽(밝은 탭)은 검정 그대로 두고,
       어두운 탭에서만 흰색으로 뒤집는다. */
    .s { fill: #0b0d10 }
    @media (prefers-color-scheme: dark) { .s { fill: #ffffff } }
  </style>
  <g class="s">
    <!-- 부리 — 길고 곧게. 작은 크기에서 황새를 가르는 것은 부리와 다리다 -->
    <path d="M49.5 9.6 63.4 12.8 49.5 16Z"/>
    <!-- 머리 -->
    <circle cx="45.2" cy="12.8" r="5.6"/>
    <!-- 목 — 가늘고 길게. 아래로 갈수록 살짝 두꺼워진다 -->
    <path d="M41.6 17.6c-3.4 4-5 9.4-5.2 15.6l6.4.6c.2-5.6 1.4-10 3.8-12.8z"/>
    <!-- 몸통 -->
    <ellipse cx="26.5" cy="35.5" rx="14.5" ry="8.6"/>
    <!-- 꼬리 -->
    <path d="M13.5 30.8 1.2 25.6 15 39.4Z"/>
    <!-- 다리 — 길게 빼야 황새로 읽힌다 -->
    <rect x="21.2" y="43" width="3" height="16.4" rx="1.5"/>
    <rect x="30.4" y="43" width="3" height="16.4" rx="1.5"/>
    <rect x="17.6" y="57.6" width="9.6" height="3" rx="1.5"/>
    <rect x="26.8" y="57.6" width="9.6" height="3" rx="1.5"/>
  </g>
</svg>
